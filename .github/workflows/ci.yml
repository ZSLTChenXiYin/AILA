name: ci

on:
  push:
    branches: [main]
  pull_request:

# AILA 只有 Go 一份实现（rfcs/0003 的 G4 收尾）。这个流水线是**唯一**的闸门：
#   go        —— Go 单文件：vet / build / test（含黄金语料、示例 IR 逐字节、端到端运行）
#   go-cross  —— 三平台交叉编译冒烟（无 cgo，纯静态产物）

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # 端到端判据要真后端：Clang/LLVM（「system:」通道）+ C 编译器
      - name: 装 LLVM + Clang（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang gcc
          clang --version | head -1
      - name: 装 LLVM（macOS）
        if: runner.os == 'macOS'
        run: |
          brew install llvm || true
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
      - name: 装 LLVM + MinGW（Windows）
        if: runner.os == 'Windows'
        run: |
          choco install llvm --no-progress -y
          echo "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          choco install mingw --no-progress -y

      - name: go vet / build
        run: go vet ./... && go build ./...

      - name: 黄金快照一致性（token / AST / 布局 / 签名 / 绑定 / IR）
        run: go run ./tools/goldengen -check

      - name: AI 技能参考一致性（cli.md / errors.md 必须与实现同步）
        run: go run ./tools/skillgen -check

      - name: go test（含示例 IR 逐字节 + 端到端运行）
        run: go test ./... -v

      - name: 单文件产物冒烟
        shell: bash
        run: |
          go build -o aila ./cmd/aila
          ./aila version
          ./aila target
          ./aila check examples/hello
          ./aila build examples/hello --emit-ir
          ./aila run examples/hello

  vscode-extension:
    # 编辑器插件：TypeScript 编译 + 文法冒烟 + 高亮覆盖检查 + 语言服务器端到端冒烟
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 构建 aila（`npm run check` 里的 LSP 冒烟要用真二进制）
        working-directory: .
        run: go build -o .local/bin/aila ./cmd/aila
      - name: 编译 + 文法冒烟 + 高亮覆盖 + LSP 冒烟
        run: npm run check
      - name: 打包 vsix
        run: npx --yes @vscode/vsce@latest package --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: aila-vscode
          path: editors/vscode/*.vsix
  go-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: 三平台交叉编译（无 cgo）
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/aila-windows-amd64.exe ./cmd/aila
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/aila-darwin-arm64 ./cmd/aila
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/aila-linux-amd64 ./cmd/aila
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: aila-managers
          path: dist/*
