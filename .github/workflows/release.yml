name: release

# 发布流水线：把「管理器 + 运行时 + 标准库 + 随包 Clang/LLVM」打成一个解压即用的 zip
# 契约：docs/specs/0003 §4/§5
#
# 触发：推 tag（v*）或手动。
# 状态：**首次 release 需人工验证**——脚本里的 sha256 校验与 3 个平台的 toolchain 拉取
#       是按官方分发形态写的，第一次跑 CI 会暴露具体差异（尤其 Linux deb 路径）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  LLVM_VERSION: "18.1.8"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: 拉取并裁剪 LLVM
        shell: pwsh
        run: ./ci/fetch-llvm.ps1
      - name: 组装发布目录
        shell: pwsh
        run: ./ci/assemble-bundle.ps1 -Platform windows-x64 -Version ${{ github.ref_name }} -Manager "go"
      - uses: actions/upload-artifact@v4
        with:
          name: aila-windows-x64
          path: dist/*.zip

  posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: 拉取并裁剪 LLVM
        run: bash ci/fetch-llvm.sh
      - name: 组装发布目录
        run: |
          bash ci/assemble-bundle.sh "${{ matrix.platform }}" "${{ github.ref_name }}" "go"
      - uses: actions/upload-artifact@v4
        with:
          name: aila-${{ matrix.platform }}
          path: dist/*.zip

  release:
    needs: [windows, posix]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 附到 release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
